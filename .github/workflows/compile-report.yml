name: Compile report

on:
  push:
    branches: [main]
    paths:
      - 'control-calidad-termico/report/**'
      - '.github/workflows/compile-report.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile LaTeX
        run: latexmk -pdf -interaction=nonstopmode -outdir=build main.tex
        working-directory: control-calidad-termico/report

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v5
        with:
          name: reporte
          path: control-calidad-termico/report/build/main.pdf
          retention-days: 90
